[package]
name = "qsh"
version = "0.2.0"
edition = "2021"
description = "Secure shell over QUIC with automatic TCP fallback"
license = "GPL-3.0-only"
repository = "https://github.com/VLOD-ZDOV/quic-ssh"
readme = "README.md"
keywords = ["ssh", "quic", "remote-shell", "networking"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
futures = "0.3"
hmac = "0.12"
nix = { version = "0.30", features = ["user", "process", "signal", "term", "fs", "ioctl", "hostname"] }
postcard = { version = "1", features = ["use-std"] }
pty-process = { version = "0.5", features = ["async"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
spake2 = "0.4"
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "encryption", "std"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["codec", "compat"] }
yamux = "0.13"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = "0.18"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
