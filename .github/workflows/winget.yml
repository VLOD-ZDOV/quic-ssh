name: WinGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.1.2)'
        required: false

jobs:
  winget:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish to WinGet
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: VLOD-ZDOV.qsh
          installers-regex: 'qsh-x86_64-windows\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
