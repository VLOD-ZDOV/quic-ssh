name: Audit

# New advisories appear without any change here. Dates, not "every 10 days":
# cron has no such step. A failed run sends the usual Actions notification.
on:
  schedule:
    - cron: "0 5 1,11,21 * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
