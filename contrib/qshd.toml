# qshd configuration.
#
# Every setting is commented out at its default: uncomment and change what
# you need. Check with `qshd -t`, apply with `systemctl reload qshd` (or a
# restart). `qshd -T` prints the settings in effect.


# ---------------------------------------------------------------- Listening

# UDP (QUIC) and TCP. IPv4 only if IPv6 is off.
# listen = "[::]:4422"

# false: UDP only, e.g. on port 22 next to sshd.
# tcp = true

# Default: host_ed25519 next to this file.
# host_key = "/etc/qsh/host_ed25519"

# Default: the key's name plus -cert.pub, if that file exists.
# host_certificate = "/etc/qsh/host_ed25519-cert.pub"


# --------------------------------------------------------------------- Keys

# ~/.config/qsh/authorized_keys (`qsh pair` adds keys there).
# use_qsh_authorized_keys = true

# Also the files below (default: ~/.ssh/authorized_keys).
# use_ssh_authorized_keys = true
# authorized_keys_file = [".ssh/authorized_keys"]

# CAs that sign user certificates, and who a certificate may log in as.
# trusted_user_ca_keys = "/etc/qsh/user_ca.pub"
# authorized_principals_file = ".ssh/principals"

# Keys that may not log in: a key list or a KRL.
# revoked_keys = "/etc/qsh/revoked_keys"

# More keys from a program (as sshd's AuthorizedKeysCommand).
# authorized_keys_command = "/usr/local/bin/get-keys %u"
# authorized_keys_command_user = "nobody"


# --------------------------------------------------------------- Logging in

# One-time codes: "off", "optional" (for who set them up), "required".
# totp = "optional"

# /etc/shadow passwords when no key works (as root, on Linux).
# password_authentication = false
# permit_empty_passwords = false

# Or "yes", "no", "forced-commands-only".
# permit_root_login = "prohibit-password"

# max_auth_tries = 6

# Seconds to log in; 0 = no limit.
# login_grace_time = 120

# Who may log in, checked in this order (as in sshd).
# deny_users = ["guest"]
# allow_users = ["alice", "bob@192.0.2.0/24"]
# deny_groups = ["nossh"]
# allow_groups = ["staff"]

# Shown before login.
# banner = "/etc/issue.net"


# ----------------------------------------------------------------- Sessions

# Seconds a dropped terminal session is kept; 0 = off.
# session_timeout = 3600

# As root under systemd: each session in a scope of its own.
# session_scope = true

# Sessions at once, per connection.
# max_sessions = 10

# permit_tty = true
# print_motd = true
# print_last_log = true

# Run ~/.ssh/rc.
# permit_user_rc = true

# Variables a client may set.
# accept_env = ["LANG", "LC_*", "COLORTERM"]

# force_command = "/usr/local/bin/menu"
# chroot_directory = "/srv/jail/%u"


# --------------------------------------------------------------- Forwarding

# Or "no", "local" (-L, -D, -W), "remote" (-R).
# allow_tcp_forwarding = true

# -R on loopback only; "yes": all addresses; or "clientspecified".
# gateway_ports = "no"

# Allowed destinations of -L/-D/-W and listeners of -R.
# permit_open = ["db.internal:5432"]
# permit_listen = ["8080"]

# Unix sockets: or "no", "local", "remote".
# allow_stream_local_forwarding = true

# allow_agent_forwarding = true
# x11_forwarding = false

# qsh -w: "yes", "point-to-point", "ethernet".
# permit_tunnel = "no"

# true: no forwarding of any kind.
# disable_forwarding = false


# ------------------------------------------------------------------- Limits

# max_connections = 256

# Logins in progress at once, and from one address.
# max_startups = 64
# max_startups_per_ip = 8

# MiB per connection; a small VM: 8-16.
# connection_buffer_mb = 32

# Slow down addresses that keep failing, except these.
# per_source_penalties = true
# per_source_penalty_exempt_list = ["192.0.2.0/24"]

# Seconds between checks of a silent client; 0 = built in (about 60 s).
# client_alive_interval = 0
# client_alive_count_max = 3


# ------------------------------------------------------------------- Tables

# Variables every session gets.
# [set_env]
# TZ = "UTC"

# For `qsh -s` and sftp.
# [subsystems]
# sftp = "internal-sftp"

# Settings for some logins, like sshd's Match.
# [[match]]
# group = "sftponly"
# chroot_directory = "/srv/sftp/%u"
# force_command = "internal-sftp"
